name: Deploy server to Droplet

on:
  # DISABLED: no droplet is provisioned yet, so automatic deploys on merge to
  # main would fail on every push. Uncomment this block once DROPLET_HOST,
  # DROPLET_USER, and DROPLET_SSH_KEY are set in repo secrets and the host is
  # bootstrapped (/home/deploy/pp-track cloned, pnpm + pm2 installed).
  # push:
  #   branches: [main]
  #   paths:
  #     - "apps/server/**"
  #     # Shared packages and the task graph affect the server build too.
  #     - "packages/**"
  #     - "turbo.json"
  #     - "pnpm-lock.yaml"
  #     - ".github/workflows/deploy-server.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  # Run the full CI suite (lint, type-check, format, build) before deploying.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/deploy/pp-track
            # Remember what is currently deployed so a failed healthcheck can
            # roll straight back to it.
            PREV_SHA=$(git rev-parse HEAD)
            # Deploy the exact commit CI just validated — a plain `git pull`
            # would race with any newer push to main.
            git fetch origin
            git checkout --detach ${{ github.sha }}
            pnpm install --frozen-lockfile
            pnpm --filter server build
            (cd apps/server && pnpm migrate:deploy)
            pm2 startOrReload apps/server/ecosystem.config.cjs --update-env
            # Gate the deploy on the app actually serving: a server that
            # crashes at boot must fail the workflow, not exit green.
            if ! curl --fail --silent --retry 5 --retry-delay 3 --retry-all-errors http://localhost:3001/health; then
              echo "Healthcheck failed — rolling back to $PREV_SHA"
              git checkout --detach "$PREV_SHA"
              pnpm install --frozen-lockfile
              pnpm --filter server build
              pm2 startOrReload apps/server/ecosystem.config.cjs --update-env
              exit 1
            fi
