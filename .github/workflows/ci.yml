name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Allow other workflows (e.g. deploy) to run these same checks as a gate.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reuse Turborepo's local task cache across runs so unchanged packages
      # skip lint/type-check/build entirely.
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm check-types

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build
