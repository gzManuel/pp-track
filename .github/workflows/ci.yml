name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Allow other workflows (e.g. deploy) to run these same checks as a gate.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This repo has leaked a secret before — scan every push/PR for new ones.
  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action reads the PR's commit list and writes findings back as
      # PR comments; without this the API call 403s.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    services:
      # Throwaway Postgres so migrations are validated in CI instead of being
      # first exercised during the production deploy.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pp_track_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/pp_track_ci
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reuse Turborepo's local task cache across runs so unchanged packages
      # skip lint/type-check/build entirely.
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm check-types

      - name: Test
        run: pnpm test:coverage

      - name: Validate migrations
        working-directory: apps/server
        run: |
          pnpm exec prisma migrate deploy --config=./prisma/prisma.config.ts
          # Fail if schema.prisma has drifted from what the migrations produce
          # (the CI database now reflects exactly the applied migrations).
          pnpm exec prisma migrate diff \
            --config ./prisma/prisma.config.ts \
            --from-config-datasource \
            --to-schema ./prisma/schema.prisma \
            --exit-code

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build
